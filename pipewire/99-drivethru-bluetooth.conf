# Drive-Thru Intercom - WirePlumber Bluetooth Configuration
# ==========================================================
# Copy this file to: ~/.config/wireplumber/wireplumber.conf.d/99-drivethru-bluetooth.conf
#
# Enables mSBC wideband voice codec for better audio quality with Bluetooth
# headsets. mSBC provides 16kHz audio (vs 8kHz for CVSD) for clearer voice.
#
# After copying, restart WirePlumber:
#   systemctl --user restart wireplumber

wireplumber.settings = {
    # Enable mSBC (wideband voice) for Bluetooth headsets
    # This provides 16kHz audio quality vs standard 8kHz CVSD
    bluez5.enable-msbc = true

    # Enable SBC-XQ for higher quality A2DP audio (if headset supports it)
    bluez5.enable-sbc-xq = true

    # Enable hardware volume control on Bluetooth devices
    bluez5.enable-hw-volume = true

    # Prefer headset profile (HSP/HFP) for voice communication
    # Set to false if you want to use A2DP by default
    bluez5.headset-roles = [ "hsp_hs", "hsp_ag", "hfp_hf", "hfp_ag" ]

    # Auto-switch between A2DP and HSP/HFP profiles
    bluez5.autoswitch-profile = true
}

# Device-specific settings for Bluetooth audio
monitor.bluez.properties = {
    # Prefer wideband voice codec
    bluez5.enable-msbc = true

    # Enable faststream for low latency (if headset supports)
    bluez5.enable-faststream = true

    # Codec negotiation: prefer quality over compatibility
    bluez5.codecs = [ "msbc", "cvsd" ]
}

# Force every Bluetooth card to come up in headset (HSP/HFP) profile
# instead of the PipeWire default of A2DP-sink. This intercom always
# needs the mic side of the headset, which A2DP does not provide.
#
# Also: disable WirePlumber's default idle-suspend (node/suspend-node.lua,
# "session.suspend-timeout-seconds", defaults to 5s of near-silence) for
# the headset's nodes. An intercom sits quiet between customers/staff
# talking - that's normal, not "idle" - but the default suspend treats it
# as idle, tears down the SCO link to save power, then has to renegotiate
# it when audio resumes. That renegotiation was showing up as the
# connect/disconnect flapping ("Host is down" in bluetoothd's log) even
# though the headset itself never actually went anywhere. This intercom
# needs the link always up, never power-saved.
monitor.bluez.rules = [
    {
        matches = [
            { device.name = "~bluez_card.*" }
        ]
        actions = {
            update-props = {
                device.profile = "headset-head-unit"
            }
        }
    }
    {
        matches = [
            { node.name = "~bluez_input.*" }
            { node.name = "~bluez_output.*" }
        ]
        actions = {
            update-props = {
                session.suspend-timeout-seconds = 0
            }
        }
    }
]

# THE reason the headset only seemed to "connect when SSH is opened":
# WirePlumber's own Bluetooth monitor (monitors/bluez.lua) only creates
# any bluez Device/Node objects at all - not audio quality, not
# reconnect speed, the *entire* Bluetooth monitor - while a logind seat
# is "active" (support.logind / monitor.bluez.seat-monitoring, see
# wireplumber.conf: "logind integration to enable certain functionality
# only on the active seat"). On a headless box with no console/graphical
# login, there's no active seat until something creates a login session -
# opening an SSH session does exactly that, which is what was "waking up"
# Bluetooth. bluetoothd itself doesn't depend on this, which is why
# `bluetoothctl info` could show "Connected: yes" the whole time while no
# audio path existed at all - WirePlumber's side was simply never running.
#
# This intercom has no seat/console concept - it should always be live.
# Disabling support.logind (nothing else in WirePlumber depends on it)
# makes monitors/bluez.lua take its unconditional "no logind plugin"
# branch, so the Bluetooth monitor always runs, seat or no seat, SSH or
# no SSH.
wireplumber.components.rules = [
    {
        matches = [
            { provides = "support.logind" }
        ]
        actions = {
            override = {
                type = disabled
            }
        }
    }
]
