# Drive-Thru Intercom - PipeWire Echo Cancellation & Audio Routing
# ================================================================
# Copy this file to: ~/.config/pipewire/pipewire.conf.d/99-drivethru-aec.conf
#
# BEFORE USING: You must replace the placeholder node names below with your
# actual device names. Find them by running:
#
#   pw-cli list-objects Node | grep -E "(node.name|node.description)"
#
# Look for:
#   - Your Behringer UMC202HD input  (alsa_input.usb-BEHRINGER_UMC202HD-*)
#   - Your Behringer UMC202HD output (alsa_output.usb-BEHRINGER_UMC202HD-*)
#   - Your Bluetooth headset sink    (bluez_output.XX_XX_XX_XX_XX_XX.*)
#   - Your Bluetooth headset source  (bluez_input.XX_XX_XX_XX_XX_XX.*)
#
# After editing, restart PipeWire:
#   systemctl --user restart pipewire pipewire-pulse wireplumber

context.modules = [
    # =========================================================================
    # Echo Cancellation Module
    # =========================================================================
    # Captures audio from the outdoor mic (UMC202HD input), applies WebRTC
    # acoustic echo cancellation using the speaker output as reference,
    # and provides cleaned audio to the virtual "dt_aec_source" node.
    #
    # The "dt_aec_sink" is where you send audio destined for the outdoor
    # speaker - it will be played through UMC202HD output with AEC applied.
    #
    {
        name = libpipewire-module-echo-cancel
        args = {
            # Latency in microseconds (lower = less delay, more CPU)
            # 50ms is a good balance for drive-thru use
            audio.rate = 48000
            audio.channels = 1

            # === REPLACE THESE WITH YOUR ACTUAL DEVICE NAMES ===
            # Find with: pw-cli list-objects Node | grep "node.name"

            # Outdoor microphone input (UMC202HD line/mic input)
            source.props = {
                node.name = "dt_aec_source"
                node.description = "Drive-Thru Mic (AEC)"
            }
            capture.props = {
                # Outdoor mic amp (USB "MV-Mixer" interface), captured
                # directly - no RNNoise stage. It was tried (see
                # 98-drivethru-rnnoise.conf.disabled) but removed after it
                # made both directions of the call sound distorted; the
                # PipeWire/WirePlumber upgrade that shipped alongside it is
                # the more likely actual cause, but pulling it out entirely
                # was the fastest way back to known-good audio.
                # node.target actually pins the stream; node.name alone only
                # labels it and leaves routing to the PipeWire default source.
                node.target = "alsa_input.usb-Shenzhen_Jiayz_Photo_Industrial_Co._Ltd_MV-Mixer-00.analog-stereo"
            }

            # Outdoor speaker output (UMC202HD line output to amplifier)
            sink.props = {
                node.name = "dt_aec_sink"
                node.description = "Drive-Thru Speaker (AEC)"
            }
            playback.props = {
                # Outdoor speaker, wired into the PC's built-in speaker jack
                # node.target actually pins the stream; node.name alone only
                # labels it and leaves routing to the PipeWire default sink.
                node.target = "alsa_output.pci-0000_00_1f.3.analog-stereo"
            }

            # WebRTC AEC parameters for outdoor/noisy environment.
            #
            # This build only exposes these five as plain on/off toggles -
            # checked directly against the compiled libspa-aec-webrtc.so
            # (strings | grep webrtc.), since the previous config had
            # several settings (noise_suppression_level, gain_control_mode,
            # analog_gain_control, echo_cancel) that don't exist in this
            # build at all and were silently no-ops the whole time. No
            # granular "level" control is available - suppression strength
            # is whatever this build's internal default is.
            aec.args = {
                webrtc.gain_control = true
                webrtc.noise_suppression = true
                webrtc.high_pass_filter = true
                webrtc.voice_detection = true

                # Targets short impulsive noise specifically (keyboard
                # clicks, wind gusts, passing traffic) rather than steady
                # background hiss - a good match for road noise.
                webrtc.transient_suppression = true
            }
        }
    }

    # =========================================================================
    # Loopback 1: Outdoor Mic -> Headset
    # =========================================================================
    # Routes the echo-cancelled outdoor microphone audio to the staff headset
    # so they can hear customers.
    #
    {
        name = libpipewire-module-loopback
        args = {
            audio.rate = 48000
            audio.channels = 1

            capture.props = {
                node.name = "dt_loopback_mic_capture"
                # Capture from the denoised outdoor mic (AEC -> DeepFilterNet,
                # see 97-drivethru-deepfilter.conf) rather than dt_aec_source
                # directly, so the headset hears the cleaned-up signal. The
                # dashboard's outdoor_mic level meter/volume slider still
                # reads dt_aec_source itself, unaffected by this change.
                node.target = "dt_denoised_source"
            }
            playback.props = {
                node.name = "dt_loopback_mic_playback"
                # M890BT Bluetooth headset (HSP/HFP headset-head-unit profile)
                node.target = "bluez_output.FC_58_FA_55_60_43.1"
                # NOTE: node.dont-reconnect = true was tried here to stop
                # WirePlumber auto-relinking this stream to the default sink
                # (dt_aec_sink / outdoor speaker) when the headset
                # disconnects - see linking-utils.lua's reconnect logic.
                # Reverted: dont-reconnect also blocks relinking back to the
                # SAME target once it reappears (prepare-link.lua's
                # was_handled check), which broke reconnection entirely -
                # "connected" but no audio. The mute-on-disconnect in
                # server/main.py's headset monitor is the actual mitigation
                # for the leak; don't reintroduce dont-reconnect without a
                # way to also clear was_handled on reconnect.
            }
        }
    }

    # =========================================================================
    # Loopback 2: Headset Mic -> Outdoor Speaker
    # =========================================================================
    # Routes the staff headset microphone to the outdoor speaker (through AEC)
    # so customers can hear staff.
    #
    {
        name = libpipewire-module-loopback
        args = {
            audio.rate = 48000
            audio.channels = 1

            capture.props = {
                node.name = "dt_loopback_headset_capture"
                # M890BT Bluetooth headset mic (HSP/HFP headset-head-unit profile)
                node.target = "bluez_input.FC_58_FA_55_60_43.0"
                # See the node.dont-reconnect note on Loopback 1's playback
                # side above - tried here too, reverted for the same reason
                # (broke reconnection).
            }
            playback.props = {
                node.name = "dt_loopback_headset_playback"
                # Send to the AEC sink (which outputs to outdoor speaker)
                node.target = "dt_aec_sink"
            }
        }
    }
]
