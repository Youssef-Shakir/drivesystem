# Drive-Thru Intercom - DeepFilterNet Neural Noise Suppression
# ================================================================
# Copy this file to: ~/.config/pipewire/pipewire.conf.d/97-drivethru-deepfilter.conf
#
# Runs the outdoor mic through DeepFilterNet (a small real-time speech
# enhancement model, https://github.com/Rikorose/DeepFilterNet) AFTER the
# WebRTC AEC stage in 99-drivethru-aec.conf, not before it - deliberately,
# so it doesn't disturb the AEC's own echo-cancellation math. An earlier
# attempt at a different denoiser (RNNoise, see
# 98-drivethru-rnnoise.conf.disabled) was wired in front of the AEC capture
# and contributed to a bad "alien"-sounding audio regression that took a
# full rollback to fix. This one only cleans up what AEC has already
# echo-cancelled, so if it ever needs to go, removing this file alone
# restores plain AEC output with no other side effects.
#
# The plugin is a prebuilt release binary from the DeepFilterNet project
# (LADSPA build, v0.5.6, sha256-verified at download time), referenced here
# by absolute path so it doesn't need to be installed system-wide.
#
# Tuned and verified against real recordings from this mic (see
# denoise-test/ during development): "Attenuation Limit (dB)" caps how much
# the model is allowed to suppress, mixing back in some of the original
# signal rather than gating it to silence - at the default of 100 (no cap)
# it was clipping quiet syllables mid-word on a real voice with the car
# engine running. 40 removes road noise while leaving speech intact. The
# "Post Filter Beta" post-filter stage was the other contributor to voice
# clipping and is disabled (0.0) for the same reason.
#
# Both values are live-tunable from the web dashboard (Settings > Outdoor
# Mic Noise Filter) without editing this file - see /api/denoise-settings
# in server/main.py and DENOISE_NODE_NAME in server/audio_control.py.
#
# After copying, restart PipeWire:
#   systemctl --user restart pipewire pipewire-pulse wireplumber

context.modules = [
    {
        name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Drive-Thru DeepFilterNet (outdoor mic)"
            media.name       = "Drive-Thru DeepFilterNet"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = deepfilter
                        # REPLACE with your actual installation path if different
                        plugin = "/home/steve/drivesystem/pipewire/plugins/libdeep_filter_ladspa.so"
                        label  = deep_filter_mono
                        control = {
                            "Attenuation Limit (dB)" = 40.0
                            "Post Filter Beta" = 0.0
                            "Min processing threshold (dB)" = -15.0
                            "Max ERB processing threshold (dB)" = 35.0
                            "Max DF processing threshold (dB)" = 35.0
                            # Live testing showed real-time underruns
                            # (RTF up to ~1.6) at the default of 0 - this
                            # mini PC's CPU doesn't always finish a frame
                            # within PipeWire's audio callback window. This
                            # gives the plugin its own extra buffer of
                            # slack (adds ~3 frames of latency, roughly
                            # 30ms) before it's forced to under-run, without
                            # touching PipeWire's global clock/quantum.
                            "Min Processing Buffer (frames)" = 3.0
                        }
                    }
                ]
            }
            audio.rate = 48000
            audio.channels = 1
            capture.props = {
                node.name = "dt_deepfilter_capture"
                # Capture from the AEC's already echo-cancelled output, not
                # the raw hardware input - see the note above.
                node.target = "dt_aec_source"
            }
            playback.props = {
                node.name = "dt_denoised_source"
                node.description = "Drive-Thru Mic (Denoised)"
                media.class = "Audio/Source"
            }
        }
    }
]
